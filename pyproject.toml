[project]
name = "hospital-directory-system"
version = "0.1.0"
description = "Deployable FastAPI backend scaffold for Hospital Directory System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12,<1.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "uvicorn[standard]>=0.34.2,<1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.9,<4.0.0"]
mysql = ["pymysql>=1.1.1,<2.0.0"]
mssql = ["pyodbc>=5.1.0,<6.0.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pytest>=8.3.5,<9.0.0",
    "ruff>=0.11.10,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
